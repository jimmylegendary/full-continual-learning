<title id="fig-c-system-title">System ONE 계산 개념도(제안)</title>
<desc id="fig-c-system-desc">입력과 목표가 입력부와 공유 코어(Titan 기억과 CMS)를 지나 출력부로 가는 주 흐름, 코어가 읽고 쓰는 지속 기억과 depth bank, 코어를 조율하는 규칙형 판단기, 지속 기억을 공고화하는 Sleep, 선택적 외부 저장소를 보인 구조도. 제안이며 구현은 없다.</desc>
