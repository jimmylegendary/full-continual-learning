<title id="fig-d-s0-se-ses-title">S0·SE·SES의 quality–compute 곡선 (개념도)</title>
<desc id="fig-d-s0-se-ses-desc">개념도이며 데이터가 아니다. 계산량에 따른 품질 꺾은선이 S0, SE, SES 순으로 왼쪽 위로 이동하면 목표 품질에 닿는 최소 계산 C*가 측정한 격자 위에서 줄어드는 모습을 보인다.</desc>
