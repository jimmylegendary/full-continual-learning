<text x="72" y="156" font-size="16" fill="#2d3142" font-weight="600">공고화</text>
<text x="72" y="176" font-size="12" fill="#4f5d75">Sleep [A03] — fast→slow 통합, Knowledge Seeding, Dreaming</text>
<text x="72" y="216" font-size="12" fill="#7a8399">A03</text>
