<text x="72" y="280" font-size="12" fill="#4f5d75">Looped [A06·A07] · MoD [A08] · MoR [A09] · Depth-Attention [A10] · AttnRes·MoDA [A11·A12]</text>
<text x="72" y="320" font-size="12" fill="#7a8399">A09·A10</text>
