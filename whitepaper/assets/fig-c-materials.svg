<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-c-materials-title fig-c-materials-desc" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',system-ui,sans-serif">
<title id="fig-c-materials-title">재료가 모델 안에서 맡는 자리와 확인 깊이</title>
<desc id="fig-c-materials-desc">System ONE에 쓰는 재료를 모델 안의 여섯 자리(기반, 빠른 기억, 느린 기억, 깊이, 공고화, 조율)로 나눠 놓고 각 재료 논문의 확인 깊이를 붙인 층 구조. 재료 논문 중 원문 정독(fulltext-read)은 0편이다.</desc>
<defs><marker id="fig-c-materials-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fig-c-materials-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="fig-c-materials-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="fig-c-materials-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
