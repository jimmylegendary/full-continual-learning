<text x="44" y="48" font-size="12" fill="#7a8399" text-anchor="end" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">L6</text>
<text x="72" y="52" font-size="16" fill="#2d3142" font-weight="600">조율 (가설)</text>
<text x="72" y="72" font-size="12" fill="#4f5d75">Rhythm-inspired control — 읽기·쓰기·계산·공고화의 시간적 조율</text>
<text x="72" y="112" font-size="12" fill="#7a8399">R01–R11</text>
