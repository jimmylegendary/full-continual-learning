<rect x="56" y="336" width="640" height="100" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="44" y="360" font-size="12" fill="#7a8399" text-anchor="end" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">L3</text>
<text x="72" y="364" font-size="16" fill="#2d3142" font-weight="600">느린 기억 (FFN 자리)</text>
<text x="72" y="384" font-size="12" fill="#4f5d75">Nested Learning/HOPE · CMS [A02] — 갱신 시간척도가 다른 여러 level의 기억</text>
<text x="72" y="424" font-size="12" fill="#7a8399">A02</text>
<rect x="100" y="408" width="136" height="24" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/>
<text x="168" y="424" font-size="12" fill="#2d3142" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">metadata-checked</text>
<rect x="56" y="440" width="640" height="100" fill="#f5f5f5"/>
<rect x="56" y="440" width="640" height="100" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="44" y="464" font-size="12" fill="#7a8399" text-anchor="end" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">L2</text>
<text x="72" y="468" font-size="16" fill="#2d3142" font-weight="600">빠른 기억 (sequence 자리)</text>
<text x="72" y="488" font-size="12" fill="#4f5d75">Titans [A01] · Titan-Llama [A04] — 입력 관계를 fast weights에 저장·읽기, sequence 경로 retrofit</text>
<text x="72" y="528" font-size="12" fill="#7a8399">A01</text>
<rect x="100" y="512" width="136" height="24" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
<text x="168" y="528" font-size="12" fill="#2d3142" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">metadata-checked</text>
<text x="252" y="528" font-size="12" fill="#7a8399">A04</text>
<rect x="280" y="512" width="192" height="24" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
<text x="376" y="528" font-size="12" fill="#2d3142" text-anchor="middle" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">official-search-checked</text>
<rect x="56" y="544" width="640" height="76" fill="#f5f5f5"/>
<rect x="56" y="544" width="640" height="76" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="44" y="568" font-size="12" fill="#7a8399" text-anchor="end" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">L1</text>
<text x="72" y="572" font-size="16" fill="#2d3142" font-weight="600">기반</text>
<text x="72" y="592" font-size="12" fill="#4f5d75">pretrained LLM 가중치(revision 고정) — 재료 논문이 아니라 출발점</text>
<line x1="24" y1="636" x2="696" y2="636" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="24" y="640" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="56" y="652" font-size="12" fill="#4f5d75">05 §5의 F_CMS 식과 §7–§9가 이 깊이에서 쓴 프로젝트 제안(깊이·느린 기억 층)</text>
<rect x="24" y="664" width="24" height="16" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="56" y="676" font-size="12" fill="#4f5d75">점선 = 확인이 가장 얕은 자리</text>
<text x="56" y="700" font-size="12" fill="#4f5d75">층 = 모델 안에서 맡는 자리의 분류(계산 순서·우열 아님). 분류는 05 §1의 &#x27;제공하는 것&#x27; 열을 이 백서가 정리한</text>
<text x="56" y="716" font-size="12" fill="#4f5d75">것이다. 재료 논문 A01–A04·A06–A15의 fulltext-read는 0편이다(design-audit §6.2).</text>
