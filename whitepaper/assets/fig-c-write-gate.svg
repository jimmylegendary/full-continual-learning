<title id="fig-c-write-gate-title">쓰기 gate의 네 질문과 phase별 해상도</title>
<desc id="fig-c-write-gate-desc">빠른 쓰기 gate를 무엇을, 어디에, 얼마나, 언제의 네 질문으로 나눠 P1부터 P4까지 어떤 해상도로 다루는지 보인 행렬. P1은 얼마나만 Titans식 surprise 정책 하나이고 나머지는 고정 정책이며, P3에서 fit·친숙도 결합과 분리 ablation이 들어간다. 문서에 적힌 것이 없는 칸은 점선이다.</desc>
