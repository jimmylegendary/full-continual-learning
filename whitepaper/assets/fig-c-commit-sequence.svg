<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-c-commit-sequence-title fig-c-commit-sequence-desc" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',system-ui,sans-serif">
<title id="fig-c-commit-sequence-title">한 질문의 읽기와 commit 순서</title>
<desc id="fig-c-commit-sequence-desc">사용자 CLI, runtime, 요청 전용 working state, 디스크의 state store 네 참여자의 순서도. runtime은 committed snapshot을 읽고 learn 또는 deep 경로에서만 working state에서 계산과 fast update를 한 뒤 commit 전 검증을 거쳐 원자적으로 commit하고 새 version을 만든 다음 응답과 결정 trace를 돌려준다. fast 경로는 쓰지 않는다.</desc>
