<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-c-bundle-title fig-c-bundle-desc" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',system-ui,sans-serif">
<title id="fig-c-bundle-title">bundle manifest와 주변 개체</title>
<desc id="fig-c-bundle-desc">외부화 단위인 bundle manifest의 필드 묶음과, 그것이 가리키는 상태 payload, source 원장, 일시 상태 bundle, 모델 revision, 이전 version의 관계를 보인 데이터 모델. 첫 phase(P1)는 이 필드의 부분집합만 쓰고 slow level과 consolidation 필드는 none이다.</desc>
<defs><marker id="fig-c-bundle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fig-c-bundle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="fig-c-bundle-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="fig-c-bundle-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M 84,440 L 84,504" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M 220,440 L 220,504" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M 356,440 L 356,504" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M 492,440 L 492,504" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<path d="M 628,440 L 628,504" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
<rect x="24" y="40" width="672" height="400" fill="#f5f5f5"/>
<rect x="24" y="40" width="672" height="400" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="32" y="48" width="80" height="16" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/>
<text x="36" y="60" font-size="12" fill="#4f5d75" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">ENTITY</text>
<text x="40" y="92" font-size="16" fill="#2d3142" font-weight="600">bundle manifest</text>
<text x="40" y="120" font-size="12" fill="#2d3142" font-weight="600">식별 · 계보</text>
<text x="40" y="136" font-size="12" fill="#4f5d75" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">artifact_id, schema_family, parent_versions, source_root_ids</text>
<text x="40" y="164" font-size="12" fill="#2d3142" font-weight="600">호환성</text>
<text x="40" y="180" font-size="12" fill="#4f5d75" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">base_model_revision, encoder_revision, tokenizer_revision,</text>
<text x="40" y="196" font-size="12" fill="#4f5d75" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">layer_bindings, parameter_shapes, norm/adapter_contract</text>
<text x="40" y="224" font-size="12" fill="#2d3142" font-weight="600">내용</text>
<text x="40" y="240" font-size="12" fill="#4f5d75" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">slow_weights_or_deltas, fast_weights, optimizer_moments,</text>
<text x="40" y="256" font-size="12" fill="#4f5d75" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">update_counters, consolidation_state</text>
<text x="40" y="284" font-size="12" fill="#2d3142" font-weight="600">적용 · 검증</text>
<text x="40" y="300" font-size="12" fill="#4f5d75" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">applicability, confidence_calibration, validation_scope</text>
<text x="40" y="328" font-size="12" fill="#2d3142" font-weight="600">저장 · 수명</text>
<text x="40" y="344" font-size="12" fill="#4f5d75" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">serialization_format, content_hashes, replay_recipe,</text>
<text x="40" y="360" font-size="12" fill="#4f5d75" font-family="ui-monospace,'SFMono-Regular','D2Coding','Noto Sans Mono CJK KR',Menlo,monospace">retention_policy, deletion_dependencies, migration_status</text>
<line x1="40" y1="384" x2="680" y2="384" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
<text x="40" y="404" font-size="12" fill="#2d3142">첫 phase는 이 중 부분집합만 쓴다: slow level · consolidation 필드는 none (09 §2)</text>
<rect x="24" y="504" width="120" height="148" rx="6" fill="#f5f5f5"/>
<rect x="24" y="504" width="120" height="148" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="84" y="552" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">상태 payload</text>
<text x="84" y="568" font-size="12" fill="#4f5d75" text-anchor="middle">1 : 1</text>
<text x="84" y="584" font-size="12" fill="#4f5d75" text-anchor="middle">weights · fast</text>
<text x="84" y="600" font-size="12" fill="#4f5d75" text-anchor="middle">state · moments</text>
<text x="84" y="616" font-size="12" fill="#4f5d75" text-anchor="middle">· counters</text>
<rect x="160" y="504" width="120" height="148" rx="6" fill="#f5f5f5"/>
<rect x="160" y="504" width="120" height="148" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="220" y="552" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">source 원장</text>
<text x="220" y="568" font-size="12" fill="#4f5d75" text-anchor="middle">N : N</text>
<text x="220" y="584" font-size="12" fill="#4f5d75" text-anchor="middle">append-only.</text>
<text x="220" y="600" font-size="12" fill="#4f5d75" text-anchor="middle">root별 경험</text>
<text x="220" y="616" font-size="12" fill="#4f5d75" text-anchor="middle">출처·철회 표시</text>
<rect x="296" y="504" width="120" height="148" rx="6" fill="#f5f5f5"/>
<rect x="296" y="504" width="120" height="148" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="356" y="544" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">일시 상태 bundle</text>
<text x="356" y="560" font-size="12" fill="#4f5d75" text-anchor="middle">1 : 0..1</text>
<text x="356" y="576" font-size="12" fill="#4f5d75" text-anchor="middle">KV · position ·</text>
<text x="356" y="592" font-size="12" fill="#4f5d75" text-anchor="middle">budget. 정확한</text>
<text x="356" y="608" font-size="12" fill="#4f5d75" text-anchor="middle">session 재개에만</text>
<text x="356" y="624" font-size="12" fill="#4f5d75" text-anchor="middle">필요</text>
<rect x="432" y="504" width="120" height="148" rx="6" fill="#f5f5f5"/>
<rect x="432" y="504" width="120" height="148" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="492" y="560" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">모델 revision</text>
<text x="492" y="576" font-size="12" fill="#4f5d75" text-anchor="middle">N : 1</text>
<text x="492" y="592" font-size="12" fill="#4f5d75" text-anchor="middle">base · encoder ·</text>
<text x="492" y="608" font-size="12" fill="#4f5d75" text-anchor="middle">tokenizer</text>
<rect x="568" y="504" width="120" height="148" rx="6" fill="#f5f5f5"/>
<rect x="568" y="504" width="120" height="148" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="628" y="544" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">이전 version</text>
<text x="628" y="560" font-size="12" fill="#4f5d75" text-anchor="middle">0..N</text>
<text x="628" y="576" font-size="12" fill="#4f5d75" text-anchor="middle">manifest의 계보.</text>
<text x="628" y="592" font-size="12" fill="#4f5d75" text-anchor="middle">A → B → A에서</text>
<text x="628" y="608" font-size="12" fill="#4f5d75" text-anchor="middle">이전 A가 유효할</text>
<text x="628" y="624" font-size="12" fill="#4f5d75" text-anchor="middle">수 있다</text>
<rect x="92" y="456" width="104" height="16" rx="2" fill="#f5f5f5"/>
<text x="96" y="468" font-size="12" fill="#4f5d75">content_hashes</text>
<rect x="228" y="480" width="104" height="16" rx="2" fill="#f5f5f5"/>
<text x="232" y="492" font-size="12" fill="#4f5d75">source_root_ids</text>
<rect x="364" y="456" width="76" height="16" rx="2" fill="#f5f5f5"/>
<text x="368" y="468" font-size="12" fill="#4f5d75">별도 bundle</text>
<rect x="500" y="480" width="112" height="16" rx="2" fill="#f5f5f5"/>
<text x="504" y="492" font-size="12" fill="#4f5d75">revision 일치 검사</text>
<rect x="516" y="456" width="104" height="16" rx="2" fill="#f5f5f5"/>
<text x="616" y="468" font-size="12" fill="#4f5d75" text-anchor="end">parent_versions</text>
<line x1="24" y1="680" x2="696" y2="680" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="24" y="684" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="56" y="696" font-size="12" fill="#4f5d75">외부화 단위</text>
<rect x="144" y="684" width="24" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="176" y="696" font-size="12" fill="#4f5d75">저장되는 것</text>
<rect x="264" y="684" width="24" height="16" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="296" y="696" font-size="12" fill="#4f5d75">선택적 · 필요할 때만</text>
<rect x="436" y="684" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="468" y="696" font-size="12" fill="#4f5d75">호환성 검사 대상</text>
<rect x="24" y="708" width="24" height="16" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="56" y="720" font-size="12" fill="#4f5d75">계보(이전 version)</text>
<text x="24" y="744" font-size="12" fill="#4f5d75">1 : 1, N : N 같은 카디널리티는 필드 이름에서 읽은 예시이며 문서가 정한 값이 아니다.</text>
</svg>
