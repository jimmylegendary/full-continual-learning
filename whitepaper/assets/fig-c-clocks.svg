<path d="M 168,532 L 696,532" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fig-c-clocks-arrow)"/>
<rect x="168" y="24" width="168" height="32" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="252" y="44" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">입력 읽기 · r = 1</text>
<rect x="344" y="24" width="64" height="32" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="376" y="44" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">write</text>
<rect x="416" y="24" width="152" height="32" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="492" y="44" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">retrofit · r = 2</text>
<rect x="576" y="24" width="120" height="32" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="636" y="44" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">답</text>
<rect x="24" y="72" width="120" height="80" rx="6" fill="#f5f5f5"/>
<rect x="24" y="72" width="120" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="84" y="108" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">경험 / root</text>
<text x="84" y="124" font-size="12" fill="#4f5d75" text-anchor="middle">e_t · root ID</text>
<rect x="24" y="160" width="120" height="80" rx="6" fill="#f5f5f5"/>
<rect x="24" y="160" width="120" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
