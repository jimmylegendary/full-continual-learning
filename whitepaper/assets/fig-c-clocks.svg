<rect x="24" y="248" width="120" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="84" y="284" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">recursion</text>
<text x="84" y="300" font-size="12" fill="#4f5d75" text-anchor="middle">r</text>
<rect x="24" y="336" width="120" height="80" rx="6" fill="#f5f5f5"/>
<rect x="24" y="336" width="120" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="84" y="372" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">optimizer step</text>
<text x="84" y="388" font-size="12" fill="#4f5d75" text-anchor="middle">u</text>
<rect x="24" y="424" width="120" height="80" rx="6" fill="#f5f5f5"/>
<rect x="24" y="424" width="120" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="84" y="460" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">level clock</text>
<text x="84" y="476" font-size="12" fill="#4f5d75" text-anchor="middle">s_l</text>
<rect x="168" y="92" width="528" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="180" y="116" font-size="12" fill="#2d3142">root R — 같은 입력의 loop·replay는 새 root나 새 증거가 아니다</text>
<line x1="168" y1="208" x2="320" y2="208" stroke="#4f5d75" stroke-width="1.2"/>
<line x1="200" y1="196" x2="200" y2="220" stroke="#2d3142" stroke-width="1.2"/>
<text x="200" y="188" font-size="12" fill="#4f5d75" text-anchor="middle">t=1</text>
<line x1="240" y1="196" x2="240" y2="220" stroke="#2d3142" stroke-width="1.2"/>
<text x="240" y="188" font-size="12" fill="#4f5d75" text-anchor="middle">t=2</text>
<line x1="280" y1="196" x2="280" y2="220" stroke="#2d3142" stroke-width="1.2"/>
<text x="280" y="188" font-size="12" fill="#4f5d75" text-anchor="middle">t=3</text>
<line x1="320" y1="196" x2="320" y2="220" stroke="#2d3142" stroke-width="1.2"/>
<text x="320" y="188" font-size="12" fill="#4f5d75" text-anchor="middle">t=4</text>
<line x1="320" y1="208" x2="696" y2="208" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="344" y="196" font-size="12" fill="#4f5d75">t 고정 — recursion마다 문맥 길이를 늘리지 않는다</text>
<rect x="168" y="260" width="240" height="32" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="288" y="280" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">r = 1</text>
<rect x="416" y="260" width="152" height="32" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="492" y="280" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">r = 2 (같은 관측)</text>
<text x="168" y="312" font-size="12" fill="#4f5d75">r은 같은 관측에 대한 계산 깊이이며 미래 관측 횟수가 아니다</text>
<line x1="376" y1="348" x2="376" y2="404" stroke="#2d3142" stroke-width="2"/>
<text x="368" y="380" font-size="12" fill="#2d3142" font-weight="600" text-anchor="end">u → u+1</text>
<text x="392" y="372" font-size="12" fill="#4f5d75">실제 update(write)를 수행할 때만 오른다</text>
<text x="392" y="392" font-size="12" fill="#4f5d75">forward 호출 수가 아니다</text>
