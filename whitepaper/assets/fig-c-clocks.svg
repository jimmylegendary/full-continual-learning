<text x="172" y="444" font-size="12" fill="#4f5d75">level 1</text>
<line x1="168" y1="488" x2="696" y2="488" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
<line x1="344" y1="480" x2="344" y2="496" stroke="#2d3142" stroke-width="1.2"/>
<line x1="600" y1="480" x2="600" y2="496" stroke="#2d3142" stroke-width="1.2"/>
<text x="172" y="476" font-size="12" fill="#4f5d75">level 2</text>
<text x="392" y="436" font-size="12" fill="#4f5d75">level마다 다른 눈금 (간격은 예시)</text>
<text x="168" y="552" font-size="12" fill="#4f5d75">wall time (실제 latency) — FLOPs나 loop 수와 같지 않다</text>
