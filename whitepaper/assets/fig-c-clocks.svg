<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-c-clocks-title fig-c-clocks-desc" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',system-ui,sans-serif">
<title id="fig-c-clocks-title">한 요청에서 시계가 따로 움직이는 모양</title>
<desc id="fig-c-clocks-desc">deep 경로 한 요청을 가정한 개념도. 경험 root는 하나로 유지되고, token 위치는 입력을 읽는 동안만 늘며, recursion 지표는 같은 관측에서 1에서 2로 오르고, optimizer step은 실제 write 때만 오르며, level별 clock은 각자의 눈금을 가진다. 아래 축은 wall time이다. 개념도이며 데이터가 아니다.</desc>
<defs><marker id="fig-c-clocks-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fig-c-clocks-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="fig-c-clocks-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="fig-c-clocks-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="340" y1="60" x2="340" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" stroke-dasharray="2,4"/>
<line x1="412" y1="60" x2="412" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" stroke-dasharray="2,4"/>
<line x1="572" y1="60" x2="572" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8" stroke-dasharray="2,4"/>
<line x1="168" y1="156" x2="696" y2="156" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<line x1="168" y1="244" x2="696" y2="244" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<line x1="168" y1="332" x2="696" y2="332" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<line x1="168" y1="420" x2="696" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
