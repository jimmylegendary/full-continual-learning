<script>
(function () {
  'use strict';
  var THEME_KEY = 'fcl-wp-theme';
  var FONT = '"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif';
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  var nodeById = {};
  RAW_NODES.forEach(function (n) { nodeById[n.id] = n; });
  var forced = new Set();
  var confOn = { EXTRACTED: true, INFERRED: true, AMBIGUOUS: true };
  var hiddenCommunities = new Set();

  function edgeStyle(e) {
    var muted = cssVar('--muted'), accent = cssVar('--accent'), warn = cssVar('--warn');
    if (e.conf === 'INFERRED') return { color: { color: accent, opacity: 0.85 }, dashes: [7, 5], width: 1.6 };
    if (e.conf === 'AMBIGUOUS') return { color: { color: warn, opacity: 0.95 }, dashes: [2, 5], width: 2.4 };
    return { color: { color: muted, opacity: 0.38 }, dashes: false, width: 1 };
  }
  function edgeTitle(e) {
    var a = nodeById[e.from], b = nodeById[e.to];
    var t = a.label + '  →  ' + b.label + '\n' + e.rel + '  [' + e.conf + (e.score != null ? ' ' + e.score : '') + ']';
    if (e.file) t += '\n근거 ' + e.file + (e.loc ? ':' + e.loc : '');
    if (e.note) t += '\n' + e.note;
    return t;
  }

  RAW_NODES.forEach(function (n) { n.fs = Math.min(40, 12 + n.degree * 0.5); });
  var nodesDS = new vis.DataSet(RAW_NODES.map(function (n, i) {
    return {
      id: n.id, label: '', size: n.size, font: { size: n.fs },
      color: { background: n.bg, border: cssVar('--muted'), highlight: { background: n.bg, border: cssVar('--fg') }, hover: { background: n.bg, border: cssVar('--fg') } },
      title: n.label + '\n' + n.kind + ' · ' + n.cname + ' · 연결 ' + n.degree + (n.file ? '\n' + n.file + (n.loc ? ':' + n.loc : '') : ''),
      x: 34 * Math.sqrt(i) * Math.cos(i * 2.4), y: 34 * Math.sqrt(i) * Math.sin(i * 2.4)
    };
  }));
  var edgesDS = new vis.DataSet(RAW_EDGES.map(function (e) {
    var st = edgeStyle(e);
    return { id: e.id, from: e.from, to: e.to, title: edgeTitle(e), color: st.color, dashes: st.dashes, width: st.width,
             arrows: { to: { enabled: true, scaleFactor: 0.4 } }, selectionWidth: 2, hoverWidth: 1.5 };
  }));

  var container = document.getElementById('graph');
  var network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
    physics: { enabled: true, solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -42, centralGravity: 0.012, springLength: 80, springConstant: 0.09, damping: 0.4, avoidOverlap: 0.3 },
      stabilization: { iterations: 300, fit: true } },
    interaction: { hover: true, tooltipDelay: 120, hideEdgesOnDrag: true, navigationButtons: false, keyboard: false },
    nodes: { shape: 'dot', borderWidth: 1.5, font: { size: 12, face: FONT, color: cssVar('--fg'), strokeWidth: 3, strokeColor: cssVar('--bg') } },
    edges: { smooth: { type: 'continuous', roundness: 0.2 } }
  });

  var lodQueued = false;
  /* 라벨: 화면에 찍히는 글자 크기가 7px 이상이고 이미 놓은 라벨과 겹치지 않을 때만 그린다(연결 수 큰 노드부터). 선택한 노드·이웃은 항상 그린다. */
  function applyLOD() {
    lodQueued = false;
    var sc = network.getScale();
    var pos = network.getPositions();
    var order = RAW_NODES.slice().sort(function (a, b) { return (forced.has(b.id) - forced.has(a.id)) || (b.degree - a.degree); });
    var placed = [], show = {};
    order.forEach(function (n) {
      if (hiddenCommunities.has(n.community)) return;
      var isForced = forced.has(n.id);
      var px = n.fs * sc;
      if (!isForced && px < 7) return;
      var p = pos[n.id]; if (!p) return;
      var d = network.canvasToDOM(p);
      var lines = n.dlabel.split('\n');
      var w = Math.max.apply(null, lines.map(function (l) { return l.length; })) * px * 0.95;
      var h = lines.length * px * 1.25;
      var r = { x0: d.x - w / 2, x1: d.x + w / 2, y0: d.y + n.size * sc + 2, y1: d.y + n.size * sc + 2 + h };
      if (!isForced && placed.some(function (q) { return !(r.x1 < q.x0 || r.x0 > q.x1 || r.y1 < q.y0 || r.y0 > q.y1); })) return;
      placed.push(r); show[n.id] = true;
    });
    nodesDS.update(RAW_NODES.map(function (n) { return { id: n.id, label: show[n.id] ? n.dlabel : '' }; }));
  }
  function queueLOD() { if (!lodQueued) { lodQueued = true; requestAnimationFrame(applyLOD); } }
  network.on('zoom', queueLOD);
  network.on('dragEnd', queueLOD);

  function restyle() {
    var fg = cssVar('--fg'), bg = cssVar('--bg');
    network.setOptions({ nodes: { font: { color: fg, strokeColor: bg } } });
    var bd = cssVar('--muted');
    nodesDS.update(RAW_NODES.map(function (n) { return { id: n.id, color: { background: n.bg, border: bd, highlight: { background: n.bg, border: fg }, hover: { background: n.bg, border: fg } } }; }));
    edgesDS.update(RAW_EDGES.map(function (e) { var st = edgeStyle(e); return { id: e.id, color: st.color, dashes: st.dashes, width: st.width }; }));
    network.redraw();
  }

  /* 테마: 'fcl-wp-theme' = light|dark, 저장값이 없으면 시스템 설정 */
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function storedTheme() { try { var t = localStorage.getItem(THEME_KEY); return (t === 'light' || t === 'dark') ? t : null; } catch (e) { return null; } }
  function applyTheme() {
    var pref = storedTheme();
    var eff = pref || ((mq && mq.matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', eff);
    document.querySelectorAll('[data-theme-choice]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.themeChoice === (pref || 'system')));
    });
    restyle();
  }
  document.querySelectorAll('[data-theme-choice]').forEach(function (b) {
    b.addEventListener('click', function () {
      var c = b.dataset.themeChoice;
      try { if (c === 'system') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, c); } catch (e) {}
      applyTheme();
    });
  });
  if (mq) { var onMq = function () { if (!storedTheme()) applyTheme(); }; if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq); }
  window.addEventListener('storage', function (ev) { if (ev.key === THEME_KEY) applyTheme(); });
  applyTheme();

  /* 정보 패널 */
  function pillFor(conf) { return '<span class="pill ' + (conf === 'EXTRACTED' ? 'ext' : conf === 'INFERRED' ? 'inf' : 'amb') + '">' + esc(conf) + '</span>'; }
  var REPO = 'https://github.com/jimmylegendary/full-continual-learning/blob/main/';
  function ghUrl(file, loc) {
    if (!file) return '';
    var u = REPO + file, m = /^L(\d+)(?:-(\d+))?$/.exec(loc || '');
    if (m) u += '?plain=1#L' + m[1] + (m[2] ? '-L' + m[2] : '');
    return u;
  }
  function ghLink(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(text) + '</a>' : esc(text); }
  function setForced(ids) { forced = new Set(ids); queueLOD(); }
  function showInfo(nodeId) {
    var n = nodeById[nodeId]; if (!n) return;
    var nbrIds = network.getConnectedNodes(nodeId);
    setForced([nodeId].concat(nbrIds));
    var items = nbrIds.map(function (id) {
      var nb = nodeById[id];
      return '<span class="neighbor-link" style="border-left-color:' + esc(nb.bg) + '" data-nid="' + esc(id) + '">' + esc(nb.label) + '</span>';
    }).join('');
    var h = '<div class="field"><b>' + esc(n.label) + '</b></div>';
    h += '<div class="field">종류: ' + esc(n.kind) + ' · 연결 ' + n.degree + '</div>';
    h += '<div class="field">커뮤니티: ' + esc(n.cname) + '</div>';
    if (n.file) h += '<div class="field">위치: ' + ghLink(ghUrl(n.file, n.loc), n.file + (n.loc ? ':' + n.loc : '')) + '</div>';
    if (nbrIds.length) h += '<div class="field" style="color:var(--muted);font-size:11px;margin-top:6px">이웃 ' + nbrIds.length + '개</div><div id="neighbors-list">' + items + '</div>';
    document.getElementById('info-content').innerHTML = h;
  }
  function showEdge(edgeId) {
    var e = RAW_EDGES[edgeId]; if (!e) return;
    var a = nodeById[e.from], b = nodeById[e.to];
    setForced([e.from, e.to]);
    var h = '<div class="field"><b>' + esc(a.label) + '</b> → <b>' + esc(b.label) + '</b></div>';
    h += '<div class="field">관계 <code>' + esc(e.rel) + '</code> ' + pillFor(e.conf) + (e.score != null ? ' <code>' + e.score + '</code>' : '') + '</div>';
    h += '<div class="field">추출: ' + (e.struct ? '스크립트(원문 글자 일치)' : '직접 읽고 작성') + '</div>';
    if (e.file) h += '<div class="field">근거: ' + ghLink(ghUrl(e.file, e.loc), e.file + (e.loc ? ':' + e.loc : '')) + '</div>';
    if (e.note) h += '<div class="field">' + (e.conf === 'EXTRACTED' ? '메모' : '추론 이유') + ': ' + esc(e.note) + '</div>';
    if (e.anchors && e.anchors.length) h += '<div class="field" style="color:var(--muted);font-size:11px">원문 앵커: ' + e.anchors.map(function (x) { return '“' + esc(x) + '”'; }).join(' · ') + '</div>';
    document.getElementById('info-content').innerHTML = h;
  }
  function focusNode(id) {
    network.focus(id, { scale: 1.3, animation: { duration: 350, easingFunction: 'easeInOutQuad' } });
    network.selectNodes([id]);
    showInfo(id);
  }
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest && ev.target.closest('.neighbor-link');
    if (el && el.dataset.nid !== undefined) focusNode(el.dataset.nid);
  });
  network.on('click', function (p) {
    if (p.nodes.length) showInfo(p.nodes[0]);
    else if (p.edges.length) showEdge(p.edges[0]);
    else { setForced([]); document.getElementById('info-content').innerHTML = '<span class="empty">노드나 연결선을 눌러 살펴보세요. 확대하면 더 많은 이름이 보입니다. 옅은 파란 영역은 하이퍼엣지(3개)입니다.</span>'; }
  });
  network.on('hoverNode', function () { container.style.cursor = 'pointer'; });
  network.on('blurNode', function () { container.style.cursor = 'default'; });

  /* 검색 */
  var searchInput = document.getElementById('search'), searchResults = document.getElementById('search-results');
  searchInput.addEventListener('input', function () {
    var q = searchInput.value.toLowerCase().trim();
    searchResults.innerHTML = '';
    if (!q) { searchResults.style.display = 'none'; return; }
    var m = RAW_NODES.filter(function (n) { return n.label.toLowerCase().indexOf(q) !== -1; }).sort(function (a, b) { return b.degree - a.degree; }).slice(0, 20);
    if (!m.length) { searchResults.style.display = 'none'; return; }
    searchResults.style.display = 'block';
    m.forEach(function (n) {
      var el = document.createElement('div');
      el.className = 'search-item'; el.tabIndex = 0; el.textContent = n.label; el.style.borderLeftColor = n.bg;
      var pick = function () { focusNode(n.id); searchResults.style.display = 'none'; searchInput.value = ''; };
      el.addEventListener('click', pick);
      el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') pick(); });
      searchResults.appendChild(el);
    });
  });

  /* 커뮤니티 범례 */
  var legendEl = document.getElementById('legend'), selectAll = document.getElementById('select-all-cb');
  function updateSelectAll() { selectAll.checked = hiddenCommunities.size === 0; selectAll.indeterminate = hiddenCommunities.size > 0 && hiddenCommunities.size < LEGEND.length; }
  function applyCommunityVisibility(ids) {
    nodesDS.update(RAW_NODES.filter(function (n) { return ids.indexOf(n.community) !== -1; }).map(function (n) { return { id: n.id, hidden: hiddenCommunities.has(n.community) }; }));
  }
  selectAll.addEventListener('change', function () {
    var hide = !selectAll.checked;
    LEGEND.forEach(function (c) { if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid); });
    document.querySelectorAll('.legend-item').forEach(function (it) { it.classList.toggle('dimmed', hide); });
    document.querySelectorAll('.legend-cb').forEach(function (cb) { cb.checked = !hide; });
    applyCommunityVisibility(LEGEND.map(function (c) { return c.cid; })); updateSelectAll();
  });
  LEGEND.forEach(function (c) {
    var item = document.createElement('div'); item.className = 'legend-item';
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'legend-cb'; cb.checked = true; cb.setAttribute('aria-label', c.label + ' 표시');
    cb.addEventListener('change', function (ev) {
      ev.stopPropagation();
      if (cb.checked) hiddenCommunities.delete(c.cid); else hiddenCommunities.add(c.cid);
      item.classList.toggle('dimmed', !cb.checked);
      applyCommunityVisibility([c.cid]); updateSelectAll();
    });
    var dot = document.createElement('div'); dot.className = 'legend-dot'; dot.style.background = c.color;
    var lab = document.createElement('span'); lab.className = 'legend-label'; lab.textContent = c.label; lab.title = c.label;
    var cnt = document.createElement('span'); cnt.className = 'legend-count'; cnt.textContent = c.count; cnt.title = c.count + '개 노드';
    item.appendChild(cb); item.appendChild(dot); item.appendChild(lab); item.appendChild(cnt);
    item.addEventListener('click', function (ev) { if (ev.target === cb) return; cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); });
    legendEl.appendChild(item);
  });

  /* 신뢰별 연결 토글 */
  function fmt(x) { return Number(x).toLocaleString('en-US'); }
  document.getElementById('cnt-ext').textContent = fmt(STATS.ext);
  document.getElementById('cnt-inf').textContent = fmt(STATS.inf);
  document.getElementById('cnt-amb').textContent = fmt(STATS.amb);
  document.querySelectorAll('#conf-legend input[data-conf]').forEach(function (cb) {
    cb.addEventListener('change', function () {
      confOn[cb.dataset.conf] = cb.checked;
      edgesDS.update(RAW_EDGES.filter(function (e) { return e.conf === cb.dataset.conf; }).map(function (e) { return { id: e.id, hidden: !cb.checked }; }));
    });
  });
  document.getElementById('stats').textContent = '노드 ' + fmt(STATS.nodes) + ' · 연결 ' + fmt(STATS.edges) + ' · 커뮤니티 ' + STATS.communities + ' · 하이퍼엣지 ' + HYPEREDGES.length + ' (graphify 산출, 2026-11-12)';

  /* 하이퍼엣지(셋 이상 묶음)를 옅은 영역으로 */
  network.on('afterDrawing', function (ctx) {
    var accent = cssVar('--accent');
    HYPEREDGES.forEach(function (h) {
      var pts = h.nodes.filter(function (id) { var n = nodesDS.get(id); return n && n.hidden !== true; })
        .map(function (id) { return network.getPositions([id])[id]; }).filter(Boolean);
      if (pts.length < 3) return;
      var cx = pts.reduce(function (s, p) { return s + p.x; }, 0) / pts.length, cy = pts.reduce(function (s, p) { return s + p.y; }, 0) / pts.length;
      var sorted = pts.slice().sort(function (a, b) { return Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx); });
      ctx.save();
      ctx.beginPath();
      sorted.forEach(function (p, i) { var x = cx + (p.x - cx) * 1.15, y = cy + (p.y - cy) * 1.15; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.closePath();
      ctx.globalAlpha = 0.07; ctx.fillStyle = accent; ctx.fill();
      ctx.globalAlpha = 0.45; ctx.strokeStyle = accent; ctx.lineWidth = 1.5; ctx.setLineDash(h.conf === 'EXTRACTED' ? [] : [6, 4]); ctx.stroke();
      ctx.restore();
    });
  });

  var statusEl = document.getElementById('status');
  network.once('stabilizationIterationsDone', function () {
    network.setOptions({ physics: { enabled: false } });
    var pos = network.getPositions(), ids = Object.keys(pos);
    var cx = 0, cy = 0;
    ids.forEach(function (id) { cx += pos[id].x; cy += pos[id].y; });
    cx /= ids.length; cy /= ids.length;
    ids.sort(function (a, b) { return Math.hypot(pos[a].x - cx, pos[a].y - cy) - Math.hypot(pos[b].x - cx, pos[b].y - cy); });
    network.fit({ nodes: ids.slice(0, Math.floor(ids.length * 0.94)), animation: false });
    applyLOD();
    statusEl.setAttribute('data-state', 'ready');
    statusEl.setAttribute('data-scale', network.getScale().toFixed(3));
    statusEl.setAttribute('data-labels', String(nodesDS.get().filter(function (n) { return n.label; }).length));
    var cv = container.querySelector('canvas'), vp = network.getViewPosition(), bb = container.getBoundingClientRect();
    statusEl.setAttribute('data-canvas', cv.width + 'x' + cv.height + ' box ' + Math.round(bb.width) + 'x' + Math.round(bb.height) + ' view ' + Math.round(vp.x) + ',' + Math.round(vp.y));
    statusEl.textContent = '그래프 준비됨: 노드 ' + fmt(STATS.nodes) + '개, 연결 ' + fmt(STATS.edges) + '개';
  });
  window.fclGraph = { network: network, nodes: nodesDS, edges: edgesDS };
})();
</script>
