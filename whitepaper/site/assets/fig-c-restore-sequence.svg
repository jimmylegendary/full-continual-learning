<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 848" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-c-restore-sequence-title fig-c-restore-sequence-desc" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',system-ui,sans-serif">
<title id="fig-c-restore-sequence-title">재시작 복원 · rollback · source 삭제</title>
<desc id="fig-c-restore-sequence-desc">세 참여자(CLI, runtime, state store)로 본 세 장면. 재시작 뒤에는 bundle manifest의 모델 revision이 맞을 때만 복원하고 다르면 거부한다. rollback은 이전 version의 weights, moments, clock, counters를 읽어 되돌린다. source 삭제는 철회를 반영하고 남은 source를 같은 순서로 재생해 재구성한다(fast state 한정).</desc>
<defs><marker id="fig-c-restore-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fig-c-restore-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="fig-c-restore-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="fig-c-restore-sequence-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
