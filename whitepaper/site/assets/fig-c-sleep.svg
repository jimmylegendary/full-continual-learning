<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-c-sleep-title fig-c-sleep-desc" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',system-ui,sans-serif">
<title id="fig-c-sleep-title">S0 · SE · SES 상태와 Sleep</title>
<desc id="fig-c-sleep-desc">대표 실험의 세 상태. S0는 retrofit과 기본 학습을 마친 상태, SE는 지정된 경험을 축적한 상태, SES는 같은 경험으로 Sleep까지 수행한 상태다. 경험 축적은 P1부터, Sleep은 P4부터이며 두 상태의 품질-계산 곡선과 C*ε를 S0와 비교한다.</desc>
<defs><marker id="fig-c-sleep-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fig-c-sleep-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="fig-c-sleep-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="fig-c-sleep-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M 40,244 L 64,244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fig-c-sleep-arrow)"/>
<path d="M 224,244 L 296,244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fig-c-sleep-arrow)"/>
<path d="M 456,244 L 528,244" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#fig-c-sleep-arrow-accent)"/>
<path d="M 352,192 L 352,176 Q 352,168 360,168 L 392,168 Q 400,168 400,176 L 400,192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fig-c-sleep-arrow)"/>
<path d="M 376,296 L 376,328 Q 376,336 368,336 L 152,336 Q 144,336 144,328 L 144,296" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#fig-c-sleep-arrow)"/>
<path d="M 608,296 L 608,376 Q 608,384 600,384 L 112,384 Q 104,384 104,376 L 104,296" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#fig-c-sleep-arrow)"/>
<rect x="296" y="24" width="400" height="112" rx="6" fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="312" y="44" font-size="12" fill="#2d3142" font-weight="600">Sleep의 첫 형태 (05 §11 PROPOSAL)</text>
<text x="312" y="64" font-size="12" fill="#4f5d75">빠른 저장소 → 느린 수준으로 가는 teacher–student replay. 후보:</text>
<text x="312" y="80" font-size="12" fill="#4f5d75">검증된 deep trajectory의 distillation · replay에서 조건·관계</text>
<text x="312" y="96" font-size="12" fill="#4f5d75">재조합 · adaptation-after-replay objective</text>
<rect x="64" y="192" width="160" height="104" rx="6" fill="#f5f5f5"/>
<rect x="64" y="192" width="160" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="72" y="200" width="48" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
<text x="76" y="212" font-size="12" fill="#4f5d75">P1부터</text>
<text x="144" y="232" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">S0</text>
<text x="144" y="248" font-size="12" fill="#4f5d75" text-anchor="middle">retrofit과 기본 학습을</text>
<text x="144" y="264" font-size="12" fill="#4f5d75" text-anchor="middle">마친 상태</text>
<rect x="296" y="192" width="160" height="104" rx="6" fill="#f5f5f5"/>
<rect x="296" y="192" width="160" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="304" y="200" width="48" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
<text x="308" y="212" font-size="12" fill="#4f5d75">P1부터</text>
<text x="376" y="232" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">SE</text>
<text x="376" y="248" font-size="12" fill="#4f5d75" text-anchor="middle">지정된 경험을</text>
<text x="376" y="264" font-size="12" fill="#4f5d75" text-anchor="middle">축적한 상태</text>
<rect x="528" y="192" width="160" height="104" rx="6" fill="#f5f5f5"/>
<rect x="528" y="192" width="160" height="104" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="536" y="200" width="48" height="16" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/>
<text x="540" y="212" font-size="12" fill="#4f5d75">P4부터</text>
<text x="608" y="232" font-size="12" fill="#2d3142" font-weight="600" text-anchor="middle">SES</text>
<text x="608" y="248" font-size="12" fill="#4f5d75" text-anchor="middle">같은 경험으로</text>
<text x="608" y="264" font-size="12" fill="#4f5d75" text-anchor="middle">Sleep까지 수행한 상태</text>
<circle cx="36" cy="244" r="4" fill="#2d3142"/>
<rect x="228" y="220" width="64" height="16" rx="2" fill="#f5f5f5"/>
<text x="260" y="232" font-size="12" fill="#4f5d75" text-anchor="middle">경험 축적</text>
<rect x="472" y="220" width="40" height="16" rx="2" fill="#f5f5f5"/>
<text x="492" y="232" font-size="12" fill="#4f5d75" text-anchor="middle">Sleep</text>
<rect x="344" y="144" width="64" height="16" rx="2" fill="#f5f5f5"/>
<text x="376" y="156" font-size="12" fill="#4f5d75" text-anchor="middle">경험 추가</text>
<rect x="188" y="312" width="144" height="16" rx="2" fill="#f5f5f5"/>
<text x="260" y="324" font-size="12" fill="#4f5d75" text-anchor="middle">C*ε(SE) 와 C*ε(S0) 비교</text>
<rect x="148" y="360" width="416" height="16" rx="2" fill="#f5f5f5"/>
<text x="356" y="372" font-size="12" fill="#4f5d75" text-anchor="middle">G-COMPUTE: C*ε(SES) &lt; C*ε(S0) ? (측정한 budget grid 안에서만, 08 §6)</text>
<text x="64" y="424" font-size="12" fill="#4f5d75">각 상태에서 controller를 우회하고 고정 depth r마다 품질 Q_s(r)를 잰다. 쉬운 사례만 일찍 끝낸 평균 loop</text>
<text x="64" y="440" font-size="12" fill="#4f5d75">감소와 구별한다 (08 §3).</text>
<line x1="24" y1="464" x2="696" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="24" y="468" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="56" y="480" font-size="12" fill="#4f5d75">상태</text>
<rect x="104" y="468" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="136" y="480" font-size="12" fill="#4f5d75">Sleep까지 거친 상태(P4부터)</text>
<line x1="324" y1="476" x2="348" y2="476" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="356" y="480" font-size="12" fill="#4f5d75">비교(측정 계획)</text>
</svg>
