<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 588" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-c-novel-paths-title fig-c-novel-paths-desc" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',system-ui,sans-serif">
<title id="fig-c-novel-paths-title">낯선 입력의 세 경로 A·B·C</title>
<desc id="fig-c-novel-paths-desc">낯선 입력을 처리하는 세 경로를 가로줄로 비교한 스윔레인. 경로 A는 빠른 쓰기 뒤 같은 입력을 다시 읽고 이어 가며, 경로 B는 쓰기 없이 가장 익숙한 지점의 잠정 답으로 이어 가고, 경로 C는 보류하고 추가 관측을 요청한다. 세 경로는 같은 관측·쓰기 예산에서 비교한다.</desc>
<defs><marker id="fig-c-novel-paths-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="fig-c-novel-paths-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="fig-c-novel-paths-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker><marker id="fig-c-novel-paths-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
