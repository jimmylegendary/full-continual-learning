<title id="fig-e-delta-title">델타 지도: 사전학습 모델 위에서 이 설계가 바꾸는 곳</title>
<desc id="fig-e-delta-desc">입력부, 재귀 core(NMM 경로, CMS 분기, P4의 Sleep), 출력부는 빌린 재료로 흐리게 그렸다. 규칙형 판단기, 상태 묶음과 원장, 같은 예산의 대조 6개 arm은 이 설계가 정한 배선이다. 쓰기 접점의 fit·친숙도 조건화와 불일치 시 구조 수정은 문헌이 비워 두었거나 조각만 구현한 공백이다.</desc>
