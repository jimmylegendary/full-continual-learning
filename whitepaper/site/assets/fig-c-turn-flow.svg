<title id="fig-c-turn-flow-title">한 번의 질문: fast · learn · deep 세 경로</title>
<desc id="fig-c-turn-flow-desc">질문이 오면 규칙형 판단기가 익숙함 신호(NMM surprise, CMS 잔차)를 두 임계값과 비교해 fast(쓰기 없이 r=1로 답), learn(surprise write 뒤 r=1로 답), deep(write 뒤 retrofit 블록을 한 번 더 적용한 r=2로 답) 중 하나를 고르고 경로·신호값·예산을 결정 trace로 남긴 뒤 응답하는 흐름도.</desc>
